services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user-service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 10s
      timeout: 60s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5

  celery:
    build: .
    command: celery -A src.celery_app worker --loglevel=info
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy


  user-service:
    build: .
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user-service
      JWT_SECRET_KEY: super_seeeecret_key
      DB_HOST: postgres
      REDIS_HOST: redis
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      celery:
        condition: service_started


volumes:
  postgres_data:



